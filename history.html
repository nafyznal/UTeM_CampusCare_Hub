<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTeM CampusCare Hub</title>
</head>
<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
        background-color: #F1E2D1;
        margin: 0;
        
        background-repeat: no-repeat;
        background-attachment: fixed;

    }

    #head{
        background-color: linear-gradient(blue, pink);
        margin: 0;
        text-align: center;
        width: 100%;
        height: 100px;
        display: flex;
        justify-content: center;
        color: #541A1A;
        cursor: default;
    }

    
    #menu {
        position: absolute;
        top: 20px;
        left: 20px;
        color: #541A1A;  
        cursor: pointer;
    }
    
    aside{
        background-color: #541A1A;
        border-radius: 20px;
        width:200px;
        height:400px;
        margin-left: 10px;
        color: white;
        

    }

    .aside{
        margin-left: 20px;
    }

    #profile{
        margin-left: 10px;
        margin-top: 10px;
    }

    li{
        list-style: none;
        text-decoration: none;
        margin-left: 20px;
        margin-bottom:50px;
        cursor: pointer;
    }

    li a{
        text-decoration: none;
        color: white;
    }
    
    p{
        display: inline-block;
        margin-left: 10px;
        margin-bottom: 10px;
    }

    .hidden{
        display:none;
    }

    .hover{
        transition: all 0.3s ease;
        transform: scale(1.1);
    }


</style>

<body>
    <div id="menu">
        <svg width="30" height="30" viewBox="0 0 24 24">
            <path d="M3 6h18M3 12h18M3 18h18"
                stroke="#541A1A"
                stroke-width="2"
                stroke-linecap="round">
  </svg>

    </div>
    <div id="head">
        <h1>History</h1>
    </div>

    <aside id="sidebar" class="hidden">
        <nav>
            
            <svg width="40" height="40" viewBox="0 0 24 24" id="profile">
                <!-- Head -->
                <circle cx="12" cy="8" r="4" 
                        stroke="white" 
                        stroke-width="2" 
                        fill="none"/>

                <!-- Body -->
                <path d="M4 20c0-4 4-6 8-6s8 2 8 6" 
                        stroke="white" 
                        stroke-width="2" 
                        fill="none"/>
            </svg>
            <p>HI!</p>
            <hr>

            <ul>
                <li id="aid"><a href="index.html">Aid</a></li>
                <li><a href="history.html">History</a></li>
                <li><a href="scan.html">Scan & Collect</a></li>
            </ul><hr>
            
            <ul>
                <li><a href="index.html">Log Out</a></li>
            </ul>
            
        </nav>
    </div>
    
</body>
<script ="text/javascript">

    document.getElementById('menu').addEventListener('click', function() {
        var sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('hidden');
    });

    document.querySelectorAll('#menu').forEach(menu=>{
        menu.addEventListener('mouseover',()=>{
            menu.classList.add('hover');
        });

        menu.addEventListener('mouseleave',()=>{
            menu.classList.remove('hover');
        });
    });

    document.querySelectorAll('li').forEach(li=>{
        li.addEventListener('mouseover',()=>{
            li.classList.add('hover');
        });

        li.addEventListener('mouseleave',()=>{
            li.classList.remove('hover');
        });
    })

</script>
</html>
