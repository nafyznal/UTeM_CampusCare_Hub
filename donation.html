<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Donate</title>
    <link rel="stylesheet" href="format.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="container">

    <!-- Back Button -->
    <a href="index.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
    </a>

    <h1>DONATE</h1>

    <div class="donation-section">

        <!-- LEFT BOX -->
        <div class="donation-form">

            <div class="top-row">
                <div>
                    <label>Amount</label>
                    <input type="number" placeholder="" id="amount">
                </div>

                <div>
                    <label>How Often</label>
                    <select>
                        <option></option>
                        <option>One Time</option>
                        <option>Weekly</option>
                        <option>Monthly</option>
                    </select>
                </div>
            </div>

            <div class="checkbox-row">
                <input type="checkbox">
                <label>Foods</label>
            </div>

            <div class="checkbox-row">
                <input type="checkbox">
                <label>Necessities</label>
            </div>

            <h2>Your Information</h2>

            <div class="top-row">

                <div>
                    <label>Name</label>
                    <input type="text" id="name">
                </div>

                <div>
                    <label>Email</label>
                    <input type="email" id="email">
                </div>

            </div>

            <div class="top-row">

                <div>
                    <label>Phone Number</label>
                    <input type="text" id="phone">
                </div>

                <div class="radio-group">
                    <label>
                        <input type="radio" name="visibility" value="Anonymous" id="anonymous">
                        Anonymous
                    </label>

                    <label>
                        <input type="radio" name="visibility" value="Recognisable" id="recognisable">
                        Recognisable
                    </label>
                </div>

            </div>

            <h2>Payment Method</h2>

            <div class="payment-method">

                <label>
                    <input type="radio" name="payment">
                    QR
                </label>

                <label>
                    <input type="radio" name="payment">
                    Credit Or Debit
                </label>

            </div>

            <button class="payment-btn" onclick="processDonation()">
                Proceed Payment
            </button>


        </div>

        <!-- RIGHT BOX -->
        <div class="donators-box">

            <h2>DONATORS</h2>

            <div id="donorList"></div>

        </div>

    </div>

</div>

<script>
    function processDonation()
    {
        let name = document.getElementById("name").value;
        let email = document.getElementById("email").value;
        let phone = document.getElementById("phone").value;
        let amount = document.getElementById("amount").value;

        if(name === "" || email === "" || phone === "" || amount === "")
        {
            alert("Please complete all fields.");
            return;
        }

        let visibility = document.querySelector('input[name="visibility"]:checked');

        if(!visibility)
        {
            alert("Please select Anonymous or Recognisable");
            return;
        }

        //display info
        let displayName;

        if(visibility.value == "Anonymous")
        {
            displayName = "Anonymous";
        }
        else
        {
            displayName = name;
        }

        let donor = {
            name:displayName, email:email, phone:phone, amount:amount
        };

        let donors = JSON.parse(localStorage.getItem("donors")) || [];

        donors.push(donor);

        localStorage.setItem("donors", JSON.stringify(donors));

        window.location.href = "successful.html";
    }

    window.onload = function(){
        let donors = JSON.parse(localStorage.getItem("donors")) || [];

        let donorList = document.getElementById("donorList");

        donorList.innerHTML = "";

        donors.forEach(function (donor)
        {
            donorList.innerHTML += `
            <p>${donor.name} - RM ${donor.amount}</p>
            `;
        });
    }
</script>

</body>
</html>
