<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Donate</title>
    <link rel="stylesheet" href="format.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="container">

    <!-- Back Button -->
    <a href="index.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
    </a>

    <h1>DONATE</h1>

    <div class="donation-section">

        <!-- LEFT BOX -->
        <div class="donation-form">

            <div class="top-row">
                <div>
                    <label>Amount</label>
                    <input type="number" placeholder="">
                </div>

                <div>
                    <label>How Often</label>
                    <select>
                        <option></option>
                        <option>One Time</option>
                        <option>Weekly</option>
                        <option>Monthly</option>
                    </select>
                </div>
            </div>

            <div class="checkbox-row">
                <input type="checkbox">
                <label>Foods</label>
            </div>

            <div class="checkbox-row">
                <input type="checkbox">
                <label>Necessities</label>
            </div>

            <h2>Your Information</h2>

            <div class="top-row">

                <div>
                    <label>Name</label>
                    <input type="text">
                </div>

                <div>
                    <label>Email</label>
                    <input type="email">
                </div>

            </div>

            <div class="top-row">

                <div>
                    <label>Phone Number</label>
                    <input type="text">
                </div>

                <div class="radio-group">
                    <label>
                        <input type="radio" name="visibility">
                        Anonymous
                    </label>

                    <label>
                        <input type="radio" name="visibility">
                        Recognisable
                    </label>
                </div>

            </div>

            <h2>Payment Method</h2>

            <div class="payment-method">

                <label>
                    <input type="radio" name="payment">
                    QR
                </label>

                <label>
                    <input type="radio" name="payment">
                    Credit Or Debit
                </label>

            </div>

            <button class="payment-btn">
                Proceed Payment
            </button>

        </div>

        <!-- RIGHT BOX -->
        <div class="donators-box">

            <h2>DONATORS</h2>

            <div class="lines"></div>
            <div class="lines"></div>
            <div class="lines"></div>
            <div class="lines"></div>
            <div class="lines"></div>
            <div class="lines"></div>
            <div class="lines"></div>
            <div class="lines"></div>
            <div class="lines"></div>
            <div class="lines"></div>
            <div class="lines"></div>

        </div>

    </div>

</div>

</body>
</html>
