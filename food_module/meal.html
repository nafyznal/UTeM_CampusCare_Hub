<!DOCTYPE html>
<head>
    <title>FOOD</title>
    <link rel="stylesheet" href="style.css">
<style>
    
.kfood{
    flex: 1;
    margin: 0 15px;
    font-weight: bold;
}
.meal{
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: flex-start;
    background-color: grey;
    background-size: cover;
    background-position: center;
    color: white;
    border-radius: 7pt;
    margin: 10pt;
    padding: 7pt;
}
.mini{
    background-image: url("image/miniMeal.jpeg");
}
#backIcon{
    position: absolute;
    top: 10px;      
    right: 10px;   
    width: 30px;
    height: 30px;
    cursor: pointer;
}
.popup{
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
}
.popup-content{
    position: relative;
    padding: 20px;
    border-radius: 10pt;
    text-align: center;
    animation: fadeIn 0.3s ease;
}
.popup-content h3{
    color: white;
}
.desc{
    color: white;
    padding: 10px;
    margin-top: 5px;
    border-radius: 6px;
    font-size: 14px;
}
.meal.mini.desc{
    display: none;
}
.meal.mini:hover .desc{
    display: block;
}
@keyframes fadeIn{
    from{opacity: 0; transform: scale(0.9);}
    to{opacity: 1; transform: scale(1);}
}
.sideBar{
    width: 250px;
    background-color: maroon;
    position: fixed;
    top: 50px;
    left: 0;
    transition: left 0.3s ease;
}
.sideBar.hidden{
    left: -250px;
}
</style>

<body>
<div id="up">
    <img src="image/burger_menu.svg" id="menuIcon" class="site" onclick="toggleSideBar()">
    <h3>Food</h3>
    <img src="image/home.svg" class="site">
</div>


<div id="content">
<div id="leftSide" class="sideBar">
    <div class="profile">
        <img src="image/profile.svg" class="site">
        <h6>Hi!</h6>
        <h6 id="name">Blablabla</h6>
    </div>
    <hr>
    <div class="item">
        <img src="image/aid.svg" class="site">
        <a href="food.html">Aid</a>
    </div>
    <div class="item">
        <ul class="aid">
            <a>Food</a>
            <li><a href="kit.html">Kit</a></li>
            <li><a href="meal.html">Meal</a></li>
            <a href="essential.html">Essential</a>
        </ul>
    </div>
    <div class="item">
        <img src="image/history.svg" class="site">
        <a href="history.html">History</a>
    </div>
    <div class="item">
        <img src="image/scan.svg" class="site">
        <a href="scan.html">Scan & Collect</a>
    </div>
    <hr/>
    <div class="center">
        <img src="image/logout.svg" class="site">
    </div>
</div>

<div id="rightSide">
    <div class="food">
        <button type="button" class="dfood" onclick="location.href='kit.html'">KIT</button>
        <button type="button" class="dfood" onclick="location.href='meal.html'">MEAL</button>
    </div>
    <div class="meal mini">
        <span class="kfood">Mini Meal</span>
        <div id="miniMeal" class="desc" style="display: none;">
            <p>Description:</p>
            <p>Nasi lemak with fried chicken</p>
        </div>
        <button type="button" class="request">Request</button>
    </div>
</div>

<div id="popup" class="popup">
    <div class="popup-content">
        <img src="image/arrowUpLeft.svg" id="backIcon">
        <img src="image/success.png" class="medium">
        <h3>Request success</h3>
    </div>
</div>  
</div>

<script>
    document.querySelectorAll('.request').forEach(btn => {
        btn.addEventListener('click', ()=>{
            document.getElementById('popup').style.display = 'flex';
        });
    });
    document.getElementById('backIcon').addEventListener('click', ()=>{
        document.getElementById('popup').style.display = 'none';
        kit.back();
    });

    const mealBox = document.querySelector('.meal.mini');
    const desc = document.getElementById('miniMeal');

    mealBox.addEventListener('mouseenter', () =>{
        desc.style.display = 'block';
    });
    mealBox.addEventListener('mouseleave', () =>{
        desc.style.display = 'none';
    })

    function toggleSideBar(){
        document.getElementById("leftSide").classList.toggle("hidden");
    }
</script>
</body>
